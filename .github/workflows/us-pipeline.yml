name: US Financial Data Pipeline

on:
  # T-601: UTC 22:00 (KST 07:00) — US 장 마감 후 수집
  #         UTC 13:00 (KST 22:00) — US_PREMARKET 리포트(KST 22:30) 전 30분 여유
  schedule:
    - cron: "0 22 * * 1-5"   # KST 07:00 장 마감 후 수집
    - cron: "0 13 * * 0-4"   # KST 22:00 장 전 뉴스 수집 (UTC Sun-Thu = KST Mon-Fri)

  workflow_dispatch:
    inputs:
      date:
        description: "수집 기준일 (YYYY-MM-DD, 미입력 시 오늘)"
        required: false
        default: ""
      market:
        description: "수집 시장"
        required: false
        default: "US"

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIR: ai-server

jobs:
  run-pipeline:
    name: Run US Financial Data Pipeline
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: poetry install --only main --no-interaction

      - name: Set pipeline date
        id: set-date
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            echo "date=$(TZ='Asia/Seoul' date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          else
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH tunnel to EC2 ChromaDB
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | base64 -d > ~/.ssh/finsight-key.pem
          chmod 600 ~/.ssh/finsight-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/finsight-key.pem \
              -L 8001:localhost:8001 \
              -N -f \
              ubuntu@"$EC2_HOST"
          echo "SSH tunnel established"

      - name: Run US pipeline with retry
        id: run-pipeline
        working-directory: ${{ env.WORKING_DIR }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          PIPELINE_DATE: ${{ steps.set-date.outputs.date }}
          PIPELINE_MARKET: ${{ github.event.inputs.market || 'US' }}
        run: |
          MAX_RETRIES=2
          ATTEMPT=0
          until poetry run python -m app.pipeline.run_pipeline; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
              echo "Pipeline failed after $MAX_RETRIES retries"
              exit 1
            fi
            echo "Attempt $ATTEMPT failed. Retrying in 60 seconds..."
            sleep 60
          done

      - name: Teardown SSH tunnel
        if: always()
        run: pkill -f "ssh.*8001" || true

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "US Pipeline completed",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Date", "value": "${{ steps.set-date.outputs.date }}", "short": true},
                  {"title": "Market", "value": "${{ github.event.inputs.market || 'US' }}", "short": true},
                  {"title": "Trigger", "value": "${{ github.event_name }}", "short": true},
                  {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "US Pipeline failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Date", "value": "${{ steps.set-date.outputs.date }}", "short": true},
                  {"title": "Market", "value": "${{ github.event.inputs.market || 'US' }}", "short": true},
                  {"title": "Retries", "value": "2 exceeded", "short": true},
                  {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
